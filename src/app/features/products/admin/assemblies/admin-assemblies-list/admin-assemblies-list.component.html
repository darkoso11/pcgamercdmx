<div class="min-h-screen bg-[#071029] text-white">
  <app-admin-header></app-admin-header>

  <main class="mx-auto max-w-7xl px-6 py-8">
    <div class="mb-8 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-cyan-400">Ensambles</h1>
        <p class="mt-2 text-sm text-slate-400">Vista de ensambles publicados y borradores en formato de tarjetas.</p>
      </div>

      <button
        (click)="createAssembly()"
        class="rounded-lg bg-gradient-to-br from-purple-600 to-indigo-600 px-5 py-3 text-sm font-bold transition hover:from-purple-700 hover:to-indigo-700"
      >
        <i class="fas fa-plus mr-2"></i>Crear ensamble
      </button>
    </div>

    <section class="mb-6 flex flex-col gap-3 rounded-xl border border-white/10 bg-[#0b1220] p-5 sm:flex-row sm:items-end sm:justify-between">
      <label class="block w-full sm:max-w-xs">
        <span class="mb-2 block text-sm text-slate-400">Estado del ensamble</span>
        <select
          [(ngModel)]="selectedStatus"
          (ngModelChange)="filterAssemblies()"
          class="w-full rounded-lg border border-white/20 bg-[#071029] px-3 py-2 text-white outline-none transition focus:border-violet-400"
        >
          <option value="all">Todos los estados</option>
          <option value="published">Publicados</option>
          <option value="draft">Borradores</option>
          <option value="low-stock">Bajo stock</option>
          <option value="out-of-stock">Sin stock</option>
        </select>
      </label>
      <p class="text-sm text-slate-400">
        Mostrando <strong class="text-violet-300">{{ filteredAssemblies.length }}</strong> de
        <strong class="text-violet-300">{{ assemblies.length }}</strong> ensambles
      </p>
    </section>

    <section *ngIf="loading" class="rounded-lg border border-white/10 bg-[#0b1220] p-10 text-center text-slate-400">
      Cargando ensambles...
    </section>

    <section *ngIf="!loading && errorMessage" class="mb-6 rounded-lg border border-red-400/40 bg-red-500/15 p-4 text-sm text-red-200">
      {{ errorMessage }}
    </section>

    <section *ngIf="!loading && filteredAssemblies.length" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
      <app-admin-assembly-card
        *ngFor="let assembly of filteredAssemblies"
        [assembly]="assembly"
        [managementMode]="true"
        (edit)="editAssembly($event)"
        (duplicate)="duplicateAssembly($event)"
        (delete)="deleteAssembly($event)"
      ></app-admin-assembly-card>
    </section>

    <section *ngIf="!loading && !filteredAssemblies.length" class="rounded-lg border border-white/10 bg-[#0b1220] p-10 text-center">
      <i class="fas fa-desktop mb-4 block text-4xl text-slate-500"></i>
      <p class="text-slate-400">{{ assemblies.length ? 'No hay ensambles con este filtro.' : 'Aun no hay ensambles.' }}</p>
      <button *ngIf="!assemblies.length" (click)="createAssembly()" class="mt-4 text-sm font-bold text-cyan-300 hover:text-cyan-100">Crear primer ensamble</button>
    </section>
  </main>
</div>
