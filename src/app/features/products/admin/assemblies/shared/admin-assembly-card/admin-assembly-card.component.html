<article class="group h-full overflow-hidden rounded-xl border border-white/10 bg-[#080f23] transition duration-200 hover:-translate-y-0.5 hover:border-violet-400/60 hover:shadow-lg hover:shadow-violet-950/30">
  <div class="relative flex h-48 items-center justify-center overflow-hidden bg-gradient-to-br from-[#111a31] via-[#101733] to-violet-950/70">
    <img
      *ngIf="assembly.image && !imageFailed; else imageFallback"
      [src]="assembly.image"
      [alt]="'Imagen principal de ' + assembly.title"
      loading="lazy"
      decoding="async"
      class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.02]"
      (error)="handleImageError()"
    />
    <ng-template #imageFallback>
      <div
        data-testid="assembly-image-fallback"
        class="flex h-full w-full flex-col items-center justify-center gap-3 text-slate-400"
        role="img"
        [attr.aria-label]="'Imagen no disponible para ' + assembly.title"
      >
        <i class="fas fa-desktop text-5xl text-violet-300/60"></i>
        <span class="text-xs font-semibold uppercase tracking-[0.16em]">Imagen no disponible</span>
      </div>
    </ng-template>

    <span
      class="absolute right-3 top-3 rounded-full px-3 py-1 text-xs font-bold backdrop-blur"
      [ngClass]="assembly.published ? 'bg-emerald-500/85 text-emerald-50' : 'bg-amber-500/85 text-amber-950'"
    >
      {{ assembly.published ? 'Publicado' : 'Borrador' }}
    </span>
  </div>

  <div class="flex min-h-52 flex-col p-5">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-violet-300">Ensamble</p>
        <h3 class="mt-1 line-clamp-2 text-lg font-black text-white">{{ assembly.title }}</h3>
      </div>
      <span *ngIf="managementMode" class="shrink-0 text-sm font-bold text-cyan-300">{{ formattedPrice }}</span>
    </div>

    <div *ngIf="specChips.length" class="mt-4 flex flex-wrap gap-2" aria-label="Características principales">
      <span
        *ngFor="let chip of specChips"
        class="rounded-full border border-white/10 bg-white/5 px-2.5 py-1 text-xs text-slate-200"
      >
        <strong class="text-violet-300">{{ chip.label }} </strong>{{ chip.value }}
      </span>
    </div>

    <div class="mt-auto flex flex-wrap items-center justify-between gap-3 border-t border-white/10 pt-4">
      <span class="text-sm text-slate-300">{{ stockLabel }}</span>
      <div class="flex flex-wrap items-center justify-end gap-3">
        <button type="button" data-action="edit" (click)="requestEdit()" class="text-sm font-bold text-violet-300 transition hover:text-violet-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-300">
          <i class="fas fa-edit mr-1" aria-hidden="true"></i>Editar
        </button>
        <button *ngIf="managementMode" type="button" data-action="duplicate" (click)="requestDuplicate()" class="text-sm font-bold text-amber-300 transition hover:text-amber-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300">
          <i class="fas fa-copy mr-1" aria-hidden="true"></i>Duplicar
        </button>
        <button *ngIf="managementMode" type="button" data-action="delete" (click)="requestDelete()" class="text-sm font-bold text-red-300 transition hover:text-red-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-300">
          <i class="fas fa-trash mr-1" aria-hidden="true"></i>Eliminar
        </button>
      </div>
    </div>
  </div>
</article>
