<div class="relative focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-pink-400"
     tabindex="0"
     role="region"
     aria-roledescription="carrusel"
     aria-label="Banners promocionales"
     (keydown)="onCarouselKeydown($event)"
     (pointerdown)="focusCarousel($event)"
     (focusin)="stopAutoPlay()">
  <!-- Banner Principal -->
  <div class="overflow-hidden rounded-xl touch-pan-x">
    <div class="relative flex transition-transform duration-700 ease-in-out will-change-transform" 
         [style.transform]="transform">
      <ng-container *ngFor="let banner of banners">
        <div class="min-w-full h-80 md:h-96 relative">
          <!-- Usamos la imagen del banner si existe, si no, usamos una imagen de Lorem Picsum -->
          <img [src]="optimizeImage(banner.imageUrl || 'https://picsum.photos/id/' + (240 + banner.id) + '/1200/600', 768)"
               [attr.data-id]="banner.id"
               [alt]="banner.title"
               loading="lazy"
               decoding="async"
               class="w-full h-full object-cover"
               (error)="handleImageError($event)" />
          
          <!-- Overlay con contenido -->
          <div class="absolute inset-0 bg-gradient-to-r from-black/70 to-transparent flex items-center">
            <div class="pl-8 md:pl-16 pr-4 md:max-w-lg">
              <h2 class="text-3xl md:text-4xl font-bold text-white mb-3">{{ banner.title }}</h2>
              <p class="text-gray-200 mb-6 hidden md:block">{{ banner.description }}</p>
              
              <!-- Si es un enlace externo usamos href, sino routerLink -->
              <a *ngIf="isExternalLink(banner.link)" 
                 [href]="banner.link" 
                 target="_blank"
                 class="bg-gradient-to-r from-pc-pink to-pc-violet text-white py-3 px-8 rounded-lg font-bold hover:shadow-lg hover:shadow-pink-500/30 transition-all inline-block">
                {{ banner.ctaText }}
              </a>
              
              <a *ngIf="!isExternalLink(banner.link)" 
                 [routerLink]="banner.link" 
                 class="bg-gradient-to-r from-pc-pink to-pc-violet text-white py-3 px-8 rounded-lg font-bold hover:shadow-lg hover:shadow-pink-500/30 transition-all inline-block">
                {{ banner.ctaText }}
              </a>
            </div>
          </div>
          
          <!-- Efecto de esquina -->
          <div class="absolute top-0 right-0 w-16 h-16 overflow-hidden">
            <div class="absolute transform rotate-45 bg-pink-700 text-white font-bold py-1 px-16 text-xs top-6 right-[-60px] shadow-lg">
              {{ banner.badgeText }}
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
  
  <!-- Navegación -->
  <button *ngIf="showArrows" type="button" (click)="prev()"
          aria-label="Banner anterior"
          class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-pc-pink/70 p-3 rounded-full text-white z-10 transition min-w-11 min-h-11">
    <i class="fas fa-chevron-left"></i>
  </button>
  <button *ngIf="showArrows" type="button" (click)="next()"
          aria-label="Banner siguiente"
          class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-pc-pink/70 p-3 rounded-full text-white z-10 transition min-w-11 min-h-11">
    <i class="fas fa-chevron-right"></i>
  </button>
  
  <!-- Indicadores -->
  <div *ngIf="showIndicators" class="flex justify-center gap-3 mt-6">
    <ng-container *ngFor="let banner of banners; let i = index">
      <button type="button"
              (click)="goToSlide(i)"
              [attr.aria-label]="'Ir al banner ' + (i + 1)"
              [attr.aria-current]="i === currentIndex ? 'true' : null"
              class="w-11 h-11 rounded-full transition-colors flex items-center justify-center bg-transparent">
        <span class="block w-3 h-3 rounded-full" [class.bg-pink-500]="i === currentIndex" [class.bg-gray-500]="i !== currentIndex"></span>
      </button>
    </ng-container>
  </div>
</div>
